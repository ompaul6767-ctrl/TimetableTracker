version: '3.9'
services:
  postgres:
    image: postgres:15-alpine
    container_name: ctms_postgres
    environment:
      POSTGRES_USER: ctms_user
      POSTGRES_PASSWORD: ctms_pass
      POSTGRES_DB: ctms_db
    ports:
      - "5432:5432"
    volumes:
      - ctms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctms_user -d ctms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ctms_pgdata:
